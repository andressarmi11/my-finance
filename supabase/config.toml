# Configuración del proyecto de Supabase, versionada.
#
# A PROPÓSITO declara SOLO lo que queremos distinto del default del
# dashboard: `supabase config push` deja intacto todo lo que este archivo
# no menciona, pero sobrescribe sin preguntar lo que sí. Un config.toml
# completo generado por `supabase init` pisaría ajustes reales del proyecto
# hospedado con valores de plantilla.
#
# Antes de cualquier push: `supabase config diff` y leerlo.

project_id = "xuguvoikrxzvklflikdh"

[auth]
# Adónde puede volver el enlace de "olvidé mi contraseña". Sin esto, el
# enlace llega pero rebota fuera de la app.
site_url = "https://andressarmi11.github.io/step-up/"
# Solo el sitio publicado. localhost estaba aquí para probar la
# recuperación en desarrollo, pero en producción dejaba que un enlace de
# "olvidé mi contraseña" terminara en un servidor local de quien lo abriera.
additional_redirect_urls = [
  "https://andressarmi11.github.io/step-up/",
]
# La app ya lo exige (MIN_PASSWORD en authStyles.ts); esto lo hace valer
# también en el servidor, para quien llame a la API sin pasar por la app.
minimum_password_length = 8

[auth.email]
# Encendido: con la app abierta a amigos, sin confirmar cualquiera podía
# registrarse con un correo ajeno. La app ya muestra "confirma el correo".
#
# OJO: el SMTP que trae Supabase de fábrica manda solo un puñado de correos
# por hora; con varios registros seguidos devuelve "email rate limit
# exceeded". Cuando eso moleste, el camino es SMTP propio (Resend, SendGrid).
enable_confirmations = true
