# Keeps dependencies and the pinned GitHub Actions current. Each update is a
# pull request: it runs CI and waits for the owner's review like any other
# change, so nothing reaches main on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine bumps instead of a dozen; security fixes still
      # arrive on their own, as soon as the advisory is published.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
