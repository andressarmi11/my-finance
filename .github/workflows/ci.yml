name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The check only reads the code. Without this the job's token gets the
# repository default, which may include write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung e2e run otherwise holds a runner for GitHub's 6-hour default.
    # The whole job takes a few minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # 'isolation' is named separately: those specs import SOURCE modules
      # (account isolation, duplicate occurrences, the xlsx bytes) and live
      # in their own project against the dev server. Without naming it here,
      # CI would never run them.
      #
      # Keep these names in sync with playwright.config.ts. Renaming a
      # project there and not here fails the whole job with "Project(s) not
      # found", which reads like the suite broke rather than a stale name.
      - run: npm run test:e2e -- --project=chromium --project=isolation
